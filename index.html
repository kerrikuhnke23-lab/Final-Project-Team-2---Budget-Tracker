<div class="app">

  <header>
    <h1>Budget Tracker</h1>
    <p>Manage your spending</p>
  </header>

  <section class="balance-card">
    <h2>$<span id="balance">0</span></h2>
    <div class="summary-row">
      <div class="income">+ $<span id="income">0</span></div>
      <div class="expense">- $<span id="expense">0</span></div>
    </div>
  </section>

  <section class="form-card">
    <form id="form">
      <input type="text" id="text" placeholder="Description" required>

      <select id="category">
        <option>Food</option>
        <option>Bills</option>
        <option>Fun</option>
        <option>Transport</option>
      </select>

      <input type="date" id="date" required>
      <input type="number" id="amount" placeholder="Amount" required>

      <button>Add Transaction</button>
    </form>
  </section>

  <section id="categoryBreakdown"></section>

  <button id="clearAll" class="clear-btn">Clear All</button>

</div>
